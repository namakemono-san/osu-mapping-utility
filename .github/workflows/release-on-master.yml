name: Release (master)

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ensure manifests are synced
        run: node .github/scripts/sync-version.mjs --check

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = node .github/scripts/sync-version.mjs --print
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check existing tag
        id: check
        shell: pwsh
        run: |
          git fetch --tags --force
          $tag = "v${{ steps.ver.outputs.version }}"
          git show-ref --tags --verify --quiet "refs/tags/$tag"
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "Tag $tag already exists; skipping release"
            "should_release=false" >> $env:GITHUB_OUTPUT
          } else {
            "should_release=true" >> $env:GITHUB_OUTPUT
          }

          exit 0

      - name: Install frontend dependencies
        if: steps.check.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and publish (Tauri Action)
        if: steps.check.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v${{ steps.ver.outputs.version }}
          releaseName: "osu! mapping utility v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
