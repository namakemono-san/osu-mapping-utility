name: Version Sync

on:
  push:
    branches:
      - master
      - develop

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Read version
        id: ver
        run: echo "version=$(node .github/scripts/sync-version.mjs --print)" >> "$GITHUB_OUTPUT"

      - name: Sync manifests
        run: node .github/scripts/sync-version.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nothing to sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/package.json MappingUtility.Parser/MappingUtility.Parser.csproj MappingUtility.Server/MappingUtility.Server.csproj MappingUtility.Logging/MappingUtility.Logging.csproj
          git commit -m "chore(version): sync manifests to v${{ steps.ver.outputs.version }}"
          git push
